# Access gateway entry: relays the packets of WireGuard and OpenVPN clients
# unchanged over two UDPlex lines to the exit (gateway_exit.yaml), which
# terminates the clients. See docs/udplex_gateway_en.md.
buffer_size: 1500
queue_size: 10240
logging:
  level: info
  format: console
  output_path: stdout
services:
  # Clients connect here; every client address gets its own connection ID,
  # which the lines carry to the exit.
  - type: listen
    tag: wg_in
    listen_addr: 0.0.0.0:51821
    timeout: 180
    broadcast_mode: false
    detour: [load_balancer]

  - type: listen
    tag: ovpn_in
    listen_addr: 0.0.0.0:1194
    timeout: 180
    broadcast_mode: false
    detour: [load_balancer]

  - type: forward
    tag: line1
    forwarders: [EXIT_HOST_1:9100]
    reconnect_interval: 5
    connection_check_time: 30
    detour: [client_filter]
    auth: {enabled: true, secret: CHANGE_ME, heartbeat_interval: 30}

  - type: forward
    tag: line2
    forwarders: [EXIT_HOST_2:9101]
    reconnect_interval: 5
    connection_check_time: 30
    detour: [client_filter]
    auth: {enabled: true, secret: CHANGE_ME, heartbeat_interval: 30}

  # Below 50 Mbit/s every packet goes over both lines; the client protocols
  # drop the second copy.
  - type: load_balancer
    tag: load_balancer
    window_size: 3
    batch_decision: true
    detour:
      - rule: "bps <= 50000000 || !available_line1 || !available_line2"
        targets: [line1, line2]
      - rule: "(bps > 50000000) && (seq % 2 == 0) && available_line1 && available_line2"
        targets: [line1]
      - rule: "(bps > 50000000) && (seq % 2 == 1) && available_line2 && available_line1"
        targets: [line2]

  # Replies go back to the listener of their protocol.
  - type: filter
    tag: client_filter
    use_proto_detectors: [wireguard]
    detour:
      wireguard: [wg_in]
    detour_miss: [ovpn_in]

protocol_detectors:
  # A WireGuard message starts with its type (1-4) and three zero bytes; the
  # first byte of an OpenVPN packet is at least 0x08.
  wireguard:
    signatures:
      - offset: 0
        bytes: "00000000"
        mask: "F8FFFFFF"
        hex: true
        length: {min: 32}

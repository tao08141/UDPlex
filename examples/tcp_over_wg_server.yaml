# Machine B: accepts the relayed connections on its wg address and dials the target.
buffer_size: 2048
logging:
  level: info
  format: console
  output_path: stdout
services:
  - type: listen
    tag: line_a
    listen_addr: 0.0.0.0:5900
    detour: [wg_server]
    auth:
      enabled: true
      secret: your-secret-key-here

  - type: listen
    tag: line_b
    listen_addr: 0.0.0.0:5901
    detour: [wg_server]
    auth:
      enabled: true
      secret: your-secret-key-here

  - type: wg
    tag: wg_server
    interface_name: wg0
    mtu: 1420
    addresses:
      - 10.66.0.1/24
    private_key: SERVER_PRIVATE_KEY_HEX
    listen_port: 51820
    peers:
      - public_key: CLIENT_PUBLIC_KEY_HEX
        allowed_ips:
          - 10.66.0.2/32

  - type: tcp_listen
    tag: tcp_in
    listen_addr: 10.66.0.1:8080
    forwarders: [127.0.0.1:80]
